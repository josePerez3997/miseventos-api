[tool.poetry]
name = "miseventos-api"
version = "0.1.0"
description = "Backend API para la plataforma de gestión de eventos \"Mis Eventos\""
authors = ["josemaria_yañez <102536119+merikorg@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.28"
pydantic = "^2.6.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
python-jose = "^3.3.0"
python-multipart = "^0.0.7"
python-dotenv = "^1.0.0"
passlib = "^1.7.4"
email-validator = "^2.1.0"
itsdangerous = "^2.1.2"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"